body: |
  Most cybersecurity policies in civil society are written, filed, and ignored. We worked with Global Partners Digital to build one their team would actually use. The process leaned on workshops with the whole team, EFF's Diceware for credential hygiene, and SOAP as the policy-building scaffold — not because tools are the answer, but because the conversations they prompt surface the real risks and habits faster than a top-down draft does.

  The final policy lives as a secure online resource, structured around practical and pragmatic tooling and advice. It tries to hold the line between security and usefulness honestly: where the threat model justifies friction, the friction stays; where it doesn't, we cut it. The work was a focused engagement, completed in 2024.

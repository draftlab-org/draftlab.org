body: |
  The Gecko Project produces global newsroom-level long-form investigative journalism, and they needed a publishing platform whose surface matched the quality of their reporting. Photography, video, data visualisations — the media isn't decoration in their stories, it carries part of the argument. The tooling also needed to match the speed and ease of use of platforms with much bigger budgets and engineering teams behind them.

  We built a fully static site that runs on edge networks, with an editorial flow in DecapCMS that keeps the moving pieces small and the source of truth single. Editors work directly against the same content the public reads. The architecture is designed to keep the hosting bill flat as readership grows and to give the team something they can keep running without us — a long-term build whose maintenance shape is as much of the design as the front-end is.

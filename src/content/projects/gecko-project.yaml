body: >-
  The Gecko Project is a nonprofit newsroom that investigates the role of land
  use in some of the most pressing global challenges: climate change,
  deforestation, the collapse of biodiversity, food security, and the rights of
  marginalised communities. Gecko needed a publishing platform that matched the
  quality of their reporting. Photography, video, and data visualisations are
  integral to their storytelling, and they needed to match the speed and ease of
  use of platforms with much bigger budgets and engineering teams behind them.


  We built a fully static site that runs on edge networks, with an editorial
  flow in DecapCMS that keeps the moving pieces small and a single source of
  truth. Over the years, we enhanced the platform with features such as
  full-screen video slides, pre-story show reels, and modular full-site and
  per-section color templates.

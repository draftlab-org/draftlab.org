body: |
  Measurement Lab runs the largest open dataset on internet performance, and their public site is the front door to that work — for researchers, journalists, advocates, and the policy community. We're supporting the team in moving it onto a modern stack: a static Astro site with content managed through PagesCMS, so editors can ship without touching code and the engineering team can focus on the platform underneath.

  The work is in the polish stage as we prepare for launch.

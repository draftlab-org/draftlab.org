body: |
  Stood up a shared data stewardship layer so aid organisations working inside Ukraine could coordinate without duplicating collection or exposing sensitive records. The platform pairs a lightweight governance council with a pragmatic data schema that partners can extend as needs shift.

  Ongoing work focuses on sustainment — documentation, hand-off to local stewards, and a light-touch review cadence that keeps the system honest as the conflict and the response evolve.

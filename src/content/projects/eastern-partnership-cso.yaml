body: |
  A programme supporting civil society organisations across Armenia, Georgia, Moldova, and Ukraine in building durable digital and governance practices. Sessions alternated between cohort-wide workshops and one-on-one clinics tailored to each organisation's stage.

  Outputs included a shared security baseline, a lightweight data-architecture template, and a peer-review council that continued to meet after the formal programme closed.

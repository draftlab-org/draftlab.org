body: >-
  A programme supporting civil society organisations across Armenia, Georgia,
  Moldova, and Ukraine in building durable digital and governance practices.
  Sessions alternated between cohort-wide workshops and one-on-one clinics
  tailored to each organisation's stage.


  Outputs included training modules, training of trainers, a [digital competence
  maturity model,](https://digicomp.perpend.io/) and a series of workshops
  across the region.

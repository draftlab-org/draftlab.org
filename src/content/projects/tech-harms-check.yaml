body: |
  Tech Harms Check is a screening tool and digital framework for evaluating the human-rights implications of technology used in development and humanitarian projects. It was designed and developed by Global Partners Digital with the Danish Institute for Human Rights and Draftlab, and it's aimed at non-expert practitioners — program officers, civil-society staff — who can upload a project proposal and get back a structured assessment: which harms are likely, how severe, and what to do about them.

  Under the hood the tool covers 54 human rights across multiple scoring dimensions, all sourced from a curated indicator library. AI is used narrowly: to extract relevant technological features and contextual factors from a proposal, and to connect them back to the library. A core design principle is the strict separation between database-driven content, which flows through verbatim from the curated library, and the limited use of generative AI, which is confined to narrative summaries and contextual mitigation suggestions and is clearly marked wherever it appears.

  Draftlab and Dot Studio partnered on the implementation of the MCP server that connects the curated library to the assessment workflow. The work spans translation between the human-rights framework and a working data model, UX for non-experts under time pressure, and a business strategy for keeping the tool sustainable past launch.

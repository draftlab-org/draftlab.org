body: >-
  Most newsrooms and civil society groups run on cloud infrastructure they don't
  control, hosted by companies whose business models conflict with their
  journalism and their mission. The Journalism Cloud Alliance, led by the Global
  Forum for Media Development and OCCRP, is an attempt to build a different
  stack: cloud infrastructure that's mission-aligned, governed by the people who
  depend on it, and engineered with human rights at the core.


  We've been supporting the Alliance since 2024, with our partners at Abrimos.
  The work started with an audit across all JCA partners to understand what they
  actually need from shared infrastructure, where their existing setups are
  strong and where they are fragile, and where collective ownership would make a
  difference. From there we developed business models and rollout strategies for
  the infrastructure itself, and we've stayed on as ongoing strategic advisors
  as the Alliance moves from concept into implementation.

  - date: 2026-02-28
    title: Research delivered, findings handed to Weblate
    update: Final report shared with the Weblate team to inform their product
      roadmap, and with Ura Design to support prototype work. We provided
      detailed feedback on Ura's translation view mockups and proposed an
      exploratory dashboard concept drawn from the manager interviews, both
      reflected in Ura's iterated designs.

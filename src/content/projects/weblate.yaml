body: >-
  [Weblate](https://weblate.org) is the open source localization platform behind
  thousands of software projects. Its capabilities have consistently grown over
  the years, and this wealth of features started to impact user experience, with
  users struggling with feature discovery, reporting, and onboarding of new
  contributors. Draftlab partnered with [Ura Design](https://ura.design) on a
  [UXD Lab](https://www.opentech.fund/labs/uxd-lab/) engagement to understand
  and surface these pain points, and propose a sequenced path forward.


  Between December 2025 and February 2026, we conducted 15 in-depth interviews
  with translators, reviewers and managers, alongside 68 survey responses
  gathered at [FOSDEM](https://fosdem.org) and through translation communities.
  The core finding: Weblate already has most of the features its users need,
  they just can't easily find or use them. 


  We identified four interconnected pain points (feature discoverability,
  reporting and data extraction, onboarding, and translator appreciation), and
  proposed four solutions: a streamlined translation view, revised user roles, a
  visual dashboard for managers, and an improved onboarding experience. To help
  with planning and prioritization, we sequenced three implementation stages,
  starting from lowest-effort, highest-impact changes. Ura Design translated
  these into working prototype mockups that provided a clear visual and UX
  direction, focused mainly on the translation view and an exploratory manager
  dashboard.

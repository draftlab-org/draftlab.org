      scheduling interviews
  - date: 2026-02-10
    title: Four pain points, four solutions
    update: "15 interviews and 68 survey responses analysed. The headline finding:
      Weblate has most of the features its users need, but interface complexity
      is preventing people from finding or using them. We proposed four
      solutions sequenced across three implementation stages, prioritising the
      lowest-effort highest-impact changes first."

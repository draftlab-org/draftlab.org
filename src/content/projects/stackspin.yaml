body: |
  Long-running studio engagement with the Stackspin team on product strategy, governance, and the grant programmes that underwrite the platform's development. Stackspin gives human-rights and civil-society organisations a sovereign alternative to mainstream collaboration tools, and the work keeps that offering coherent as the ecosystem around it shifts.

  Current focus is on funding diversification and on a clearer product surface for the organisations adopting Stackspin for the first time.

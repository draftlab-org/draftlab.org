body: >-
  This engagement supported WVI in taking stock of its disaster response digital
  ecosystem as a whole: the systems, data sources, and processes that underpin
  how disasters are declared, responses are planned and managed, supplies are
  tracked, funds are allocated, and information is communicated outward. Our aim
  was to identify where investment in integration, automation, and new tooling
  would have the most impact. A central goal was to help move the organisation
  toward an interoperable ecosystem capable of answering operational and
  fundraising questions as close to real time as possible.


  The work combined ecosystem mapping, stakeholder interviews, and designing a
  digital maturity model spanning governance, technology and data, processes,
  value, ways of working, and strategy. From that foundation we've produced
  proofs of concept and integration designs — most notably a Response Firehose
  PoC for a near-real-time decision-making dashboard, and a working prototype
  that integrates AI into WVI's response plan creation process.


  Deliverables to date include the ecosystem map and maturity model, an
  interoperability and data-source analysis, written PoC documents and slide
  decks for internal stakeholders, an API specification for the logistics layer,
  and a roadmap covering short-term MVP integrations alongside a longer-term
  vision for treating response plans as structured, machine-readable artifacts.
  In September 2025 we launched a first working prototype of an AI-assisted
  response-plan creator, which takes user input and produces a workable draft as
  a Word document plus an Excel budget, delivered straight to the requester's
  inbox, built securely in end-to-end WVI infrastructure.
updates:
  - date: 2025-09-01
    title: AI-assisted response-plan creator
    update: Launched the first working prototype of an AI-assisted response plan
      creator. It takes user input and produces a workable draft as a Word
      document, plus an Excel file with budget breakdown, delivered straight to
      the requester's inbox. The entire pipeline runs inside WVI infrastructure,
      safely and securely.
  - date: 2025-02-15
    title: Response Firehose PoC
    update: Designed and presented the Response Firehose proof of concept, a
      near-real-time decision-making dashboard that pulls together internal
      logistics, financial, and response-planning data alongside external
      humanitarian context.
  - date: 2025-01-15
    title: Discovery interviews
    update: Stakeholder interviews and discovery in order to surface where data
      lives, who owns it, and where cross-system gaps might be found.
  - date: 2024-11-01
    title: Ecosystem map and maturity model
    update: Ecosystem mapping and digital maturity model designed covering
      governance, technology and data, processes, value, ways of working, and
      strategy.
  - date: 2024-08-01
    title: Kickoff
    update: Project scoped and kicked off — a longer-form follow-on to the earlier
      data-mapping work, broadened across WVI's disaster-management ecosystem.

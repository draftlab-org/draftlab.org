body: >-
  Civil society organizations urgently need the ability to protect their staff's
  personal information online during escalating threats — without permanently
  deleting content or spending hours on manual edits. Responsive Privacy is an
  open-source framework that lets organizations shift their website between full
  transparency and emergency protection mode in minutes, using a single
  environment variable and a set of pre-mapped privacy levels. This project will
  expand the framework into plug-and-play plugins for the most widely used
  website platforms, pair it with an interactive decision guide, and build a
  training-of-trainers program for digital security specialists worldwide.


  The project began as a contained UXD Lab engagement between Draftlab and
  Superbloom, who led on user research and provided their own site for testing.
  Our work showed that there's a real and urgent need for organizations to be
  able to evaluate and implement their current privacy needs, allowing them to
  rapidly respond to acute threats to their team and community. For this reason
  we turned our prototype into Responsive Privacy, and committed to developing
  it as a long-term program that will include plugins for the most widely used
  website platforms, an interactive decision guide for organisations weighing
  what to expose, and training-of-trainers modules for digital security
  specialists who can carry it into their own networks.


  The project is actively seeking funding for the next two to five years of
  work.
updates:
  - date: 2026-04-15
    title: responsiveprivacy.org launches
    update: responsiveprivacy.org is live. The framework, the decision guide, and
      the first round of platform plugins are available for everyone; we are
      looking forward to hearing from people using it.
  - date: 2026-01-15
    title: Unifying prototypes into a programme
    update: Started unifying the technical prototypes and the user research into a
      single brand and programme. The decision to develop this beyond a one-off
      project came out of seeing both the demand and the absence of any
      equivalent tooling for civil society.
  - date: 2025-11-15
    title: Research synthesis published
    update: First version of the research is online. The synthesis covers what
      civil-society organisations actually do when their staff are targeted,
      what tooling exists, and where the gaps are.
    body: The research is hosted at
      [https://research-superbloom.netlify.app/overview/synthesis/](https://research-superbloom.netlify.app/overview/synthesis/)
      — a Superbloom-led writeup that grounded the next phase of the work.

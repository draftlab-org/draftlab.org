    content: >-
      # About Draftlab


      Draftlab is a design and technology studio that works with civil society
      organisations, NGOs, open tech projects, and multi-stakeholder
      initiatives. We build tools that serve people.


      We believe technology should be appropriate to its context: secure where
      it needs to be, sovereign where it matters, simple where complexity would
      be a burden. Our clients are under-resourced, values-driven, and
      navigating problems that don't have neat technical solutions. We meet them
      where they are.


      What makes us different is a disposition. We treat every engagement as a
      design problem, whether that means facilitating a workshop, writing a
      technical specification, building a platform, or helping a team govern the
      thing they've already built. We show up as partners.

[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "24"

# Preview site: create a second Netlify site from the same repo and set
# PUBLIC_PREVIEW = "true" in its environment (Site settings → Environment
# variables). Preview builds render drafts with labels, are noindex, draw a
# visible frame and load no analytics. Do not set it here, or the live site
# becomes a preview too.

[[headers]]
  for = "/api/*"
  [headers.values]
    Access-Control-Allow-Origin = "*"

# Collapse duplicate hosts onto the canonical domain. Netlify serves the site on
# its default subdomain and on branch subdomains too; without these rules Google
# sees three copies of every page.
[[redirects]]
  from = "https://dlnext.netlify.app/*"
  to = "https://draftlab.org/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://main--dlnext.netlify.app/*"
  to = "https://draftlab.org/:splat"
  status = 301
  force = true

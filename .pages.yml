# ============================================================================
# Pages CMS 2.0 Configuration — Draftlab.org
# Documentation: https://pagescms.org/docs/configuration/
# ============================================================================

settings:
  content:
    merge: true # preserve keys not managed by CMS
  commit:
    templates:
      create: 'Create {path} (via Pages CMS)'
      update: 'Update {path} (via Pages CMS)'

# ============================================================================
# MEDIA
# ============================================================================
media:
  - name: images
    label: All Images
    input: src/assets
    output: /src/assets

# ============================================================================
# REUSABLE COMPONENTS
# ============================================================================
components:
  # --------------------------------------------------------------------------
  # Primitives
  # --------------------------------------------------------------------------

  button:
    type: object
    fields:
      - name: variant
        label: Variant
        type: select
        options:
          values:
            - label: Primary
              name: primary
            - label: Secondary
              name: secondary
            - label: Outline
              name: outline
            - label: Ghost
              name: ghost
        required: true
        default: primary
      - name: size
        label: Size
        type: select
        options:
          values:
            - label: Small
              name: sm
            - label: Medium
              name: md
            - label: Large
              name: lg
        required: true
        default: md
      - name: text
        label: Text
        type: string
        required: true
        description: The text displayed on the button
      - name: href
        label: Link URL
        type: string
        required: true
        description: The URL this button links to

  card:
    type: object
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: content
        label: Content
        type: rich-text
        description: Brief description of the card
      - name: image
        label: Image
        type: image
        description: Card image (absolute path, e.g. /src/assets/images/card.jpg)
      - name: color
        label: Color
        type: select
        options:
          values:
            - label: Primary
              name: primary
            - label: Secondary
              name: secondary
            - label: Highlight
              name: highlight
            - label: Neutral
              name: neutral
        description: Card color theme
      - name: button
        label: Button
        component: button

  # --------------------------------------------------------------------------
  # Navigation
  # --------------------------------------------------------------------------

  flexible_link:
    type: block
    blockKey: type
    description: Link that can reference an internal page or external URL
    blocks:
      - name: internal
        label: Internal Page Link
        fields:
          - name: pageRef
            label: Page Reference
            type: reference
            required: true
            options:
              collection: pages
              value: '/{permalink}'
              label: '{title} (/{permalink})'
            description: Select a page from the pages collection

      - name: external
        label: External Link
        fields:
          - name: url
            label: External URL
            type: string
            required: true
            description: Full URL (e.g. https://example.com)
            pattern:
              message: 'Must be a valid URL starting with http:// or https://'
              regex: '^https?://.+'

  navigation_menu_item:
    type: block
    blockKey: type
    description: Navigation item that can be a single link or a dropdown menu
    blocks:
      - name: link
        label: Single Link
        fields:
          - name: label
            label: Link Label
            type: string
            required: true
          - name: link
            label: Link
            component: flexible_link
            required: true
          - name: description
            label: Description
            type: string
            description: Optional description for accessibility

      - name: dropdown
        label: Dropdown Menu
        fields:
          - name: label
            label: Menu Label
            type: string
            required: true
          - name: children
            label: Menu Links
            type: object
            list: true
            required: true
            fields:
              - name: label
                label: Link Label
                type: string
                required: true
              - name: link
                label: Link
                component: flexible_link
                required: true
              - name: description
                label: Description
                type: string

  # --------------------------------------------------------------------------
  # Layout
  # --------------------------------------------------------------------------

  background_select:
    type: object
    fields:
      - name: bgColor
        label: Color
        type: select
        options:
          values:
            - label: White
              name: white
            - label: Gray
              name: gray
            - label: Gradient
              name: gradient
            - label: Phase Gradient
              name: phase-gradient
            - label: Phase Gradient (light)
              name: phase-gradient-light
        default: white
      - name: bgType
        label: Type
        type: select
        options:
          values:
            - label: Full-width
              name: full
            - label: Contained
              name: contained
        default: full

  # --------------------------------------------------------------------------
  # Section components
  # --------------------------------------------------------------------------

  hero_section:
    type: object
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: backgroundImage
        label: Background Image
        type: image

  richtext_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: withTOC
        label: Include Table of Contents
        type: boolean
        default: false
      - name: content
        label: Content
        type: rich-text
        required: true
        description: Markdown content for this section

  button_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title (Optional)
        type: string
        required: false
      - name: buttons
        label: Buttons
        component: button
        list: true

  card_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: rich-text
      - name: cards
        label: Cards
        component: card
        list: true
      - name: buttons
        label: Action Buttons
        component: button
        list: true

  people_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select

  # --- Draftlab-specific section components ---

  feed_grid_section:
    type: object
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
        description: Optional intro text shown above the chronological feed of mixed projects + quotes.

  latest_updates_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
        description: Optional intro shown above the dispatches feed.
      - name: limit
        label: Limit
        type: number
        description: How many updates to display. Defaults to 4.

  how_we_work_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
        description: Optional intro text shown above the phases timeline.

  projects_roll_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        default: Featured projects
      - name: description
        label: Description
        type: string
      - name: limit
        label: Number of Projects
        type: number
        description: How many projects to show. Leave empty to show all.
      - name: filterPhase
        label: Filter by Phase
        type: select
        options:
          values:
            - label: Understand
              name: understand
            - label: Define
              name: define
            - label: Deliver
              name: deliver
            - label: Sustain
              name: sustain
        description: Only show projects in this phase. Leave empty to show all.
      - name: filterModality
        label: Filter by Modality
        type: select
        options:
          values:
            - label: Clinic
              name: clinic
            - label: Studio
              name: studio
            - label: Community
              name: community
        description: Only show projects using this modality. Leave empty to show all.
      - name: featuredOnly
        label: Featured Only
        type: boolean
        default: false
      - name: hideImages
        label: Hide Images
        type: boolean
        default: false
        description: Suppress card images so all blocks stay the same size.
      - name: wide
        label: Wide Cards
        type: boolean
        default: false
        description: Two cards per row in a landscape (wider-than-tall) aspect ratio.

  phases_overview_section:
    type: object
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string

  modalities_overview_section:
    type: object
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string

  skills_section:
    type: object
    fields:
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string

  organisations_roll_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string
      - name: filterType
        label: Filter by Type
        type: select
        options:
          values:
            - label: Client
              name: client
            - label: Partner
              name: partner
            - label: Funder
              name: funder
        description: Only show organisations of this type. Leave empty to show all.
      - name: limit
        label: Limit
        type: number

  project_update:
    type: object
    fields:
      - name: date
        label: Date
        type: date
        required: true
      - name: title
        label: Title
        type: string
        description: Optional display title shown above the update.
      - name: update
        label: Update
        type: rich-text
        required: true
        description: The body of the update. Supports markdown.
      - name: image
        label: Featured image
        type: image
        description: Optional. Used as a thumbnail in the latest-updates feed and as a feature image on the project timeline.
      - name: body
        label: Long-form body
        type: rich-text
        description: Optional web-only enrichment shown below the main update.

  skills_cloud_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: eyebrow
        label: Eyebrow
        type: string
        description: Small mono-uppercase kicker above the heading.
      - name: heading
        label: Heading
        type: string
      - name: body
        label: Body
        type: string

  uxd_cta_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
      - name: statement
        label: Statement
        type: string
        description: Headline statement above the description.
      - name: description
        label: Description
        type: string
      - name: href
        label: CTA Link URL
        type: string
        description: Where the CTA button links to.

  apply_for_uxd_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
      - name: description
        label: Description
        type: string

  cal_embed_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: calLink
        label: Cal.com link
        type: string
        description: e.g. 'tin-geber/intro' — the path after cal.com/.
      - name: namespace
        label: Namespace
        type: string
        description: Optional Cal.com embed namespace.
      - name: origin
        label: Origin
        type: string
        description: Optional Cal.com origin URL.
      - name: minHeight
        label: Minimum Height
        type: string
        description: CSS height value (e.g. '600px').

  flexi_section:
    type: object
    fields:
      - name: background
        label: Section Background
        component: background_select
      - name: title
        label: Title
        type: string
        required: true
      - name: description
        label: Description
        type: rich-text
      - name: sections
        label: Nested Sections
        component: section
        list: true

  # Subset of section types allowed inside flexi sections
  section:
    type: block
    blockKey: type
    blocks:
      - name: richText
        label: Rich Text Section
        component: richtext_section
      - name: button
        label: Button Section
        component: button_section
      - name: card
        label: Card Section
        component: card_section

# ============================================================================
# CONTENT COLLECTIONS
# ============================================================================
content:
  # --------------------------------------------------------------------------
  # Pages
  # --------------------------------------------------------------------------
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    format: yaml
    filename: '{fields.permalink}.yaml'
    view:
      fields: [title, description, status]
      primary: title
    fields:
      - name: title
        label: Page Title
        type: string
        required: true

      - name: permalink
        label: Permalink
        type: string
        required: true
        description: The slug, without slashes (e.g. 'about' or 'work').
        pattern:
          message: "Must be a web-safe string like 'about' or 'work'."
          regex: '^[a-zA-Z0-9_-]*$'

      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              name: draft
            - label: Published
              name: published
            - label: Archived
              name: archived

      - name: description
        label: Page Description
        type: string
        description: SEO meta description

      - name: heroImage
        label: Hero Image
        type: image

      - name: background
        label: Page Background
        type: select
        default: white
        options:
          values:
            - label: White
              name: white
            - label: Gray
              name: gray
            - label: Gradient
              name: gradient
            - label: Highlight
              name: highlight

      - name: sections
        label: Page Sections
        type: block
        list:
          collapsible:
            collapsed: true
            summary: '{type}'
        required: true
        blockKey: type
        description: Add and arrange page sections in any order
        blocks:
          - name: hero
            label: Hero Section
            component: hero_section

          - name: richText
            label: Rich Text Section
            component: richtext_section

          - name: button
            label: Button Section
            component: button_section

          - name: card
            label: Card Section
            component: card_section

          - name: people
            label: People Section
            component: people_section

          - name: projectsRoll
            label: Projects Roll
            component: projects_roll_section

          - name: feedGrid
            label: Feed Grid
            component: feed_grid_section

          - name: latestUpdates
            label: Latest Updates (gradient banner)
            component: latest_updates_section

          - name: howWeWork
            label: How We Work (phases timeline + modalities)
            component: how_we_work_section

          - name: phasesOverview
            label: Phases Overview
            component: phases_overview_section

          - name: modalitiesOverview
            label: Modalities Overview
            component: modalities_overview_section

          - name: organisationsRoll
            label: Organisations Roll
            component: organisations_roll_section

          - name: skills
            label: Skills
            component: skills_section

          - name: skillsCloud
            label: Skills Cloud
            component: skills_cloud_section

          - name: uxdCta
            label: UXD CTA
            component: uxd_cta_section

          - name: applyForUxd
            label: Apply for UXD
            component: apply_for_uxd_section

          - name: calEmbed
            label: Cal.com Embed
            component: cal_embed_section

          - name: flexi
            label: Flexi Section
            component: flexi_section

  # --------------------------------------------------------------------------
  # Projects
  # --------------------------------------------------------------------------
  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml
    filename: '{fields.slug}.yaml'
    subfolders: false
    view:
      fields: [name, client, status, contentStatus, slug]
      primary: name
      sort: [name]
    fields:
      - name: name
        label: Project Name
        type: string
        required: true

      - name: slug
        label: Slug
        type: string
        required: true
        description: URL-friendly identifier (e.g. gecko-project)
        pattern:
          message: "Must be a web-safe string like 'gecko-project'."
          regex: '^[a-zA-Z0-9_-]*$'

      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              name: draft
            - label: Published
              name: published
            - label: Archived
              name: archived

      - name: contentStatus
        label: Content readiness
        type: select
        required: true
        default: placeholder
        description: Internal review state. Placeholder = still dummy/auto-generated; Polish = generated, awaiting human review; Ready = signed off for users.
        options:
          values:
            - label: Placeholder
              name: placeholder
            - label: Polish
              name: polish
            - label: Ready
              name: ready

      - name: description
        label: Description
        type: text
        required: true

      - name: client
        label: Client
        type: reference
        options:
          collection: organisations
          value: '{id}'
          label: '{fields.name}'

      - name: partners
        label: Partners
        type: reference
        options:
          collection: organisations
          multiple: true
          value: '{id}'
          label: '{fields.name}'
        description: Other organisations involved in this project

      - name: phases
        label: Phases
        type: select
        required: true
        options:
          multiple: true
          values:
            - label: Understand
              name: understand
            - label: Define
              name: define
            - label: Deliver
              name: deliver
            - label: Sustain
              name: sustain

      - name: modalities
        label: Modalities
        type: select
        required: true
        options:
          multiple: true
          values:
            - label: 'Clinic ◎'
              name: clinic
            - label: 'Studio ◈'
              name: studio
            - label: 'Community ◉'
              name: community

      - name: skills
        label: Skills
        type: reference
        options:
          collection: skills
          multiple: true
          value: '{slug}'
          label: '{fields.name}'
        description: Types of work involved in this project

      - name: yearStart
        label: Start Year
        type: number

      - name: yearEnd
        label: End Year
        type: number

      - name: projectStatus
        label: Project Status
        type: select
        default: complete
        options:
          values:
            - label: Active
              name: active
            - label: Complete
              name: complete

      - name: featured
        label: Featured
        type: boolean
        default: false
        description: Show in featured sections

      - name: image
        label: Image
        type: image

      - name: url
        label: Project URL
        type: string

      - name: body
        label: Long Description
        type: rich-text

      - name: updates
        label: Updates
        component: project_update
        list:
          collapsible:
            collapsed: true
            summary: '{fields.date} — {fields.title}'
        description: Project dispatches. Optional — add as many as you need.

  # --------------------------------------------------------------------------
  # Organisations
  # --------------------------------------------------------------------------
  - name: organisations
    label: Organisations
    type: collection
    path: src/content/organisations
    format: json
    filename: '{fields.id}.json'
    subfolders: false
    view:
      fields: [image, name, type]
      sort: [type, name]
      search: [name]
      primary: name
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: Unique identifier in slug format (e.g. gecko-project). Used as the filename and for references from other collections. Cannot be changed after creation.
        pattern:
          message: "Must be a web-safe slug like 'gecko-project'."
          regex: '^[a-z0-9][a-z0-9-]*$'

      - name: name
        label: Organisation Name
        type: string
        required: true

      - name: type
        label: Type
        type: select
        required: true
        options:
          values:
            - label: Client
              name: client
            - label: Partner
              name: partner
            - label: Funder
              name: funder

      - name: url
        label: Website URL
        type: string

      - name: image
        label: Logo
        type: image
        description: Organisation logo (e.g. /src/assets/organisations/logo.svg)

  # --------------------------------------------------------------------------
  # People
  # --------------------------------------------------------------------------
  - name: people
    label: People
    type: collection
    path: src/content/people
    format: json
    filename: '{fields.id}.json'
    subfolders: false
    view:
      fields: [headshot, name, title, status]
      primary: name
    fields:
      - name: id
        label: ID
        type: string
        required: true
        description: Unique identifier in slug format (e.g. tin-geber). Used as the filename. Cannot be changed after creation.
        pattern:
          message: "Must be a web-safe slug like 'tin-geber'."
          regex: '^[a-z0-9][a-z0-9-]*$'

      - name: name
        label: Name
        type: string
        required: true

      - name: status
        label: Status
        type: select
        required: true
        default: draft
        options:
          values:
            - label: Draft
              name: draft
            - label: Published
              name: published
            - label: Archived
              name: archived

      - name: headshot
        label: Headshot
        type: image
        required: true

      - name: title
        label: Job Title / Role
        type: string

      - name: role
        label: Practice Role
        type: string
        description: Role within Draftlab (e.g. Creative Director)

      - name: bio
        label: Bio
        type: text
        description: Short biography

      - name: affiliation
        label: Affiliation
        type: string

      - name: extraInfo
        label: Other/Previous Affiliations
        type: string

      - name: social
        label: Social Media Links
        type: object
        fields:
          - name: personalSite
            label: Personal Website URL
            type: string
          - name: bluesky
            label: BlueSky URL
            type: string
          - name: mastodon
            label: Mastodon URL
            type: string
          - name: github
            label: GitHub URL
            type: string
          - name: linkedin
            label: LinkedIn URL
            type: string
          - name: x
            label: X URL
            type: string
          - name: facebook
            label: Facebook URL
            type: string
          - name: instagram
            label: Instagram URL
            type: string
          - name: youtube
            label: YouTube URL
            type: string
          - name: medium
            label: Medium URL
            type: string

      - name: skills
        label: Skills
        type: reference
        options:
          collection: skills
          multiple: true
          value: '{slug}'
          label: '{fields.name}'
        description: Skills this person brings to the practice

  # --------------------------------------------------------------------------
  # Phases (framework data)
  # --------------------------------------------------------------------------
  - name: phases
    label: Phases
    type: collection
    path: src/content/phases
    format: json
    filename: '{fields.slug}.json'
    subfolders: false
    view:
      fields: [name, number]
      primary: name
      sort: [number]
      default:
        sort: number
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true

      - name: number
        label: Number
        type: number
        required: true
        description: Phase order (1–4)

      - name: slug
        label: Slug
        type: select
        required: true
        options:
          values:
            - label: Understand
              name: understand
            - label: Define
              name: define
            - label: Deliver
              name: deliver
            - label: Sustain
              name: sustain

      - name: tagline
        label: Tagline
        type: string
        required: true

      - name: description
        label: Description
        type: rich-text
        required: true
        description: Supports markdown formatting

      - name: color
        label: Color Token
        type: string
        required: true
        description: CSS color token name (e.g. phase-understand)

  # --------------------------------------------------------------------------
  # Modalities (framework data)
  # --------------------------------------------------------------------------
  - name: modalities
    label: Modalities
    type: collection
    path: src/content/modalities
    format: json
    filename: '{fields.slug}.json'
    subfolders: false
    view:
      fields: [name, symbol]
      primary: name
      sort: [order]
      default:
        sort: order
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true

      - name: slug
        label: Slug
        type: select
        required: true
        options:
          values:
            - label: 'Clinic ◎'
              name: clinic
            - label: 'Studio ◈'
              name: studio
            - label: 'Community ◉'
              name: community

      - name: symbol
        label: Symbol
        type: string
        required: true
        description: Unicode symbol (◎, ◈, or ◉)

      - name: tagline
        label: Tagline
        type: string
        required: true

      - name: description
        label: Description
        type: text
        required: true

      - name: order
        label: Display Order
        type: number
        required: true

  # --------------------------------------------------------------------------
  # Skills
  # --------------------------------------------------------------------------
  - name: skills
    label: Skills
    type: collection
    path: src/content/skills
    format: json
    filename: '{fields.slug}.json'
    subfolders: false
    view:
      fields: [name, icon, status]
      primary: name
    fields:
      - name: name
        label: Skill Name
        type: string
        required: true

      - name: slug
        label: Slug
        type: string
        required: true
        description: URL-friendly identifier (e.g. user-research). Used as the filename and for references from projects. Cannot be changed after creation.
        pattern:
          message: "Must be a web-safe string like 'user-research'."
          regex: '^[a-zA-Z0-9_-]*$'

      - name: description
        label: Description
        type: string
        required: true
        description: Short list of activities (e.g. "interviews, usability testing, synthesis")

      - name: icon
        label: Icon
        type: string
        required: true
        description: 'Iconify icon ID (e.g. hugeicons:test-tube-01)'

      - name: status
        label: Status
        type: select
        required: true
        default: published
        options:
          values:
            - label: Draft
              name: draft
            - label: Published
              name: published
            - label: Archived
              name: archived

  # --------------------------------------------------------------------------
  # Quotes
  # --------------------------------------------------------------------------
  - name: quotes
    label: Quotes
    type: collection
    path: src/content/quotes
    format: json
    filename: '{fields.date}-{fields.name}.json'
    subfolders: false
    view:
      fields: [date, name, organisation]
      primary: name
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: date
        label: Date
        type: date
        required: true

      - name: name
        label: Name
        type: string
        required: true
        description: Name of the person being quoted

      - name: quote
        label: Quote
        type: text
        required: true

      - name: organisation
        label: Organisation
        type: reference
        required: true
        options:
          collection: organisations
          value: '{id}'
          label: '{fields.name}'

      - name: project
        label: Project
        type: reference
        options:
          collection: projects
          value: '{slug}'
          label: '{fields.name}'
        description: Optional — leave empty if the quote isn't tied to a specific project

  # --------------------------------------------------------------------------
  # Site Settings (singleton)
  # --------------------------------------------------------------------------
  - name: site-config
    label: Site Settings
    type: file
    path: src/content/site/config.json
    fields:
      - name: title
        label: Site Title
        type: string
        required: true

      - name: description
        label: Site Description
        type: string
        required: true

      - name: url
        label: Site URL
        type: string
        required: true
        description: "Your website's URL (e.g. https://draftlab.org)"

      - name: favicon
        label: Favicon Path
        type: string
        default: /favicon.svg

      - name: defaultOgImage
        label: Default Open Graph Image
        type: image
        description: Wide social-card image (1.91:1 or 2:1 — used by Twitter/LinkedIn/Facebook).

      - name: defaultOgImageSquare
        label: Default Square Social Image
        type: image
        description: Optional 1:1 thumbnail (1200×1200 recommended) used by Slack inline previews, iMessage, and some RSS readers.

      - name: defaultLogoLight
        label: Logo (Light Background)
        type: image

      - name: defaultLogoDark
        label: Logo (Dark Background)
        type: image

      - name: social
        label: Social Media Links
        type: object
        fields:
          - name: bluesky
            label: BlueSky URL
            type: string
          - name: mastodon
            label: Mastodon URL
            type: string
          - name: github
            label: GitHub URL
            type: string
          - name: linkedin
            label: LinkedIn URL
            type: string
          - name: x
            label: X URL
            type: string
          - name: facebook
            label: Facebook URL
            type: string
          - name: instagram
            label: Instagram URL
            type: string
          - name: youtube
            label: YouTube URL
            type: string
          - name: medium
            label: Medium URL
            type: string

      - name: footer
        label: Footer
        type: object
        fields:
          - name: description
            label: Footer Description
            type: string
          - name: bottom
            label: Bottom Text
            type: string
            required: true
            description: Text shown at the bottom of the footer (supports markdown)

      - name: archivedBanner
        label: Archived Banner
        type: object
        fields:
          - name: message
            label: Message
            type: string
            required: true
          - name: color
            label: Color
            type: select
            required: true
            default: secondary
            options:
              values:
                - label: Primary
                  name: primary
                - label: Secondary
                  name: secondary
                - label: Highlight
                  name: highlight
                - label: Neutral
                  name: neutral

      - name: cookieConsent
        label: Cookie Consent
        type: object
        fields:
          - name: message
            label: Banner Message
            type: rich-text
            required: true
          - name: googleAnalyticsId
            label: Google Analytics Measurement ID
            type: string
            description: 'GA4 Measurement ID (e.g. G-XXXXXXXXXX). Leave empty to disable.'

  # --------------------------------------------------------------------------
  # Navigation Menus
  # --------------------------------------------------------------------------
  - name: navigation
    label: Navigation Menus
    type: collection
    path: src/content/navigation
    format: json
    filename: '{fields.slug}.json'
    subfolders: false
    view:
      fields: [title]
      primary: title
    fields:
      - name: slug
        label: Menu ID
        type: string
        required: true
        description: Unique identifier for this menu (e.g. main, footer-1)
        pattern:
          message: "Must be a web-safe string like 'main' or 'footer-1'."
          regex: '^[a-zA-Z0-9_-]*$'

      - name: title
        label: Menu Title
        type: string
        required: true

      - name: items
        label: Menu Items
        component: navigation_menu_item
        list:
          collapsible:
            collapsed: false
            summary: '{label}'
        required: true
